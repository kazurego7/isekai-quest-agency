name: CI
on:
  pull_request:
  push:
    branches: [main, work, develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test tests/demo-data.test.mjs
      - run: npm run build
      - name: Initialize fresh local D1
        run: |
          for migration in drizzle/*.sql; do
            node --import ./scripts/sites-env.mjs ./node_modules/wrangler/bin/wrangler.js d1 execute DB --local --config dist/server/wrangler.json --persist-to .wrangler/state --file "$migration"
          done
      - name: Check application flows
        run: |
          npm run dev > /tmp/quest-dev.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:5177/ > /dev/null; then break; fi
            sleep 2
          done
          curl --fail http://127.0.0.1:5177/ > /dev/null
          TEST_BASE_URL=http://127.0.0.1:5177 npm run test:integration
      - name: Check production authentication
        run: |
          npm start -- --port 8789 > /tmp/quest-production.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8789/ > /dev/null; then break; fi
            sleep 2
          done
          TEST_PRODUCTION_URL=http://127.0.0.1:8789 node --test tests/production-auth.test.mjs
